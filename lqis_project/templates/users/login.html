{% extends 'base.html' %}
{% block title %}Login | LQIS{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="mb-3">Sign In</h4>
        <form method="post">{% csrf_token %}
          {{ form.as_p }}
          <button class="btn btn-tea">Login</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
