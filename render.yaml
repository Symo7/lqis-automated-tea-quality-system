databases:
  - name: lqis-postgres
    databaseName: lqis
    user: lqis_admin
    plan: free

services:
  - type: web
    name: lqis-web
    env: python
    buildCommand: "./build.sh"
    startCommand: "cd lqis_project && gunicorn lqis_project.wsgi:application --bind 0.0.0.0:$PORT --timeout 120 --workers 2 --preload"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lqis-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DEBUG
        value: "False"
      - key: CLOUDINARY_URL
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: worker
    name: lqis-worker
    env: python
    buildCommand: "./build.sh"
    startCommand: "cd lqis_project && python manage.py qcluster"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lqis-postgres
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: lqis-web
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: "False"
      - key: CLOUDINARY_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
